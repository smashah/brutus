<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1015" viewBox="0 0 1200 1015" role="img" aria-labelledby="title desc">
<title id="title">Brutus: find the processes slowing your Mac</title>
<desc id="desc">Real preview-mode terminal capture showing memory pressure, RAM, swap, SSD headroom, three individual process choices with commands, and keyboard controls. Local project names and paths are redacted.</desc>
<rect width="1200" height="1015" rx="24" fill="#080d14"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="64" y="58" font-size="19" fill="#a6b4c6">macOS · native C · MIT</text>
<text x="64" y="142" font-size="74" font-weight="700" fill="#6bdded">Brutus</text>
<text x="64" y="193" font-size="31" fill="#e6edf3">Find what’s slowing your Mac.</text>
<rect x="48" y="236" width="1104" height="704" rx="16" fill="#101720" stroke="#293443"/>
<circle cx="76" cy="260" r="6" fill="#f38b82"/><circle cx="98" cy="260" r="6" fill="#f7c66d"/><circle cx="120" cy="260" r="6" fill="#8bd49c"/>
<text x="600" y="267" text-anchor="middle" font-size="16" fill="#a6b4c6">brutus --dry-run</text>
<text x="64" y="982" font-size="18" fill="#a6b4c6">Captured from the running CLI. Local names and paths redacted. Nothing closed.</text>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" style="font-variant-ligatures:none" xml:space="preserve">
